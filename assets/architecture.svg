<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" width="100%" height="100%" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="routerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="codexGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="agyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Outer Canvas -->
  <rect x="4" y="4" width="1232" height="722" rx="14" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <text x="32" y="38" font-size="18" font-weight="700" fill="#0F172A">codex-antigravity-dialogue · 双端桌面 Agent 授信通信与任务交接架构</text>
  <text x="32" y="59" font-size="12.5" fill="#475569">基于既有 MCP 桥接层实现同项目跨桌面安全交接：前置五项核验 → 单次幂等派单 → 传输层与任务态四层证据分离</text>

  <!-- Top Right Legend Pills -->
  <rect x="840" y="20" width="116" height="24" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
  <text x="898" y="36" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">同项目路径强绑定</text>

  <rect x="966" y="20" width="116" height="24" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="1024" y="36" font-size="11" font-weight="600" fill="#B45309" text-anchor="middle">单请求 UUID 幂等</text>

  <rect x="1092" y="20" width="116" height="24" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="1150" y="36" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">传输与任务态分离</text>

  <!-- ==================== LAYER 1: PROTOCOL ROUTER (SKILL.md) ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="32" y="74" width="1176" height="82" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
    <path d="M 32 84 Q 32 74 42 74 L 210 74 L 210 156 L 42 156 Q 32 156 32 146 Z" fill="url(#routerGrad)"/>
    <text x="121" y="108" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">三段式交接协议</text>
    <rect x="67" y="118" width="108" height="22" rx="5" fill="#334155"/>
    <text x="121" y="133" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle" font-family="Consolas, monospace">SKILL.md</text>

    <!-- Stage 1 -->
    <rect x="226" y="86" width="312" height="58" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="238" y="108" font-size="12.5" font-weight="700" fill="#0F172A">Stage 1 · 前置五项核验 (Preflight Lock)</text>
    <text x="238" y="128" font-size="10.2" fill="#475569">锁定宿主路由 · 同项目 cwd · 空闲目标 · 新 UUID · 授权边界</text>

    <!-- Stage 2 -->
    <rect x="552" y="86" width="316" height="58" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="564" y="108" font-size="12.5" font-weight="700" fill="#0F172A">Stage 2 · 单次幂等派单 (Idempotent Dispatch)</text>
    <text x="564" y="128" font-size="10.2" fill="#475569">携带结构化契约 (Reply-To: UUID)；严禁超时重发与跨路由代偿</text>

    <!-- Stage 3 -->
    <rect x="882" y="86" width="312" height="58" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="894" y="108" font-size="12.5" font-weight="700" fill="#0F172A">Stage 3 · 关联取回与台账恢复 (Correlate)</text>
    <text x="894" y="128" font-size="10.2" fill="#475569">区分双端非对称取回路径；未决请求输出 Handoff Ledger 续查</text>
  </g>

  <!-- ==================== LAYER 2: DUAL HOSTS & BRIDGE CENTERPIECE ==================== -->

  <!-- LEFT COLUMN: OpenAI Codex Desktop (x=32..336, w=304) -->
  <g filter="url(#cardShadow)">
    <rect x="32" y="176" width="304" height="408" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <path d="M 32 186 Q 32 176 42 176 L 326 176 Q 336 176 336 186 L 336 232 L 32 232 Z" fill="url(#codexGrad)"/>
    <text x="48" y="201" font-size="14.5" font-weight="700" fill="#FFFFFF">OpenAI Codex Desktop</text>
    <text x="48" y="220" font-size="11" font-weight="600" fill="#DBEAFE">宿主端 A · 桌面原生会话 (surface=&quot;desktop&quot;)</text>

    <!-- Codex Box 1 -->
    <rect x="46" y="246" width="276" height="104" rx="7" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="58" y="266" font-size="12.5" font-weight="700" fill="#1E3A8A">1. 出站桥接 · antigravity-bridge</text>
    <text x="58" y="285" font-size="10.5" fill="#1E40AF" font-family="Consolas, monospace">· antigravity_bridge_status()</text>
    <text x="58" y="302" font-size="10.5" fill="#1E40AF" font-family="Consolas, monospace">· list_antigravity_conversations()</text>
    <text x="58" y="319" font-size="10.5" fill="#1E40AF" font-family="Consolas, monospace">· send_to_antigravity_conversation()</text>
    <text x="58" y="336" font-size="10.5" fill="#1E40AF" font-family="Consolas, monospace">· read_antigravity_delivery()</text>

    <!-- Codex Box 2 -->
    <rect x="46" y="362" width="276" height="94" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="58" y="382" font-size="12.5" font-weight="700" fill="#0F172A">2. 入站伴侣 · codex-native-relay</text>
    <text x="58" y="401" font-size="10.8" fill="#475569">· 调用 native_relay_status() 核查反向就绪</text>
    <text x="58" y="419" font-size="10.8" fill="#475569">· 监听本地端点，将反重力消息注入目标线程</text>
    <text x="58" y="437" font-size="10.8" fill="#B45309" font-weight="600">· 注：desktop.available=true 不代表反向就绪</text>

    <!-- Codex Box 3 -->
    <rect x="46" y="468" width="276" height="68" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="58" y="488" font-size="12.5" font-weight="700" fill="#0F172A">3. 本地应答与防回拨死循环</text>
    <text x="58" y="506" font-size="10.8" fill="#475569">· 默认在自身线程内以 Reply-To: &lt;UUID&gt; 作答</text>
    <text x="58" y="523" font-size="10.8" fill="#475569">· 未获反向授权时不主动调用出站发送工具</text>

    <!-- Codex Footer -->
    <rect x="46" y="546" width="276" height="26" rx="5" fill="#DBEAFE"/>
    <text x="184" y="563" font-size="9.6" font-weight="600" fill="#1E3A8A" text-anchor="middle" font-family="Consolas, monospace">&lt;CODEX_HOME&gt;/skills/codex-antigravity-dialogue</text>
  </g>

  <!-- Bidirectional Arrows Between Left, Center, and Right -->
  <line x1="336" y1="278" x2="368" y2="278" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <line x1="872" y1="278" x2="904" y2="278" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <line x1="904" y1="342" x2="872" y2="342" stroke="#D97706" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
  <line x1="368" y1="342" x2="336" y2="342" stroke="#D97706" stroke-width="2.2" marker-end="url(#arrowAmber)"/>

  <!-- CENTER COLUMN: Bidirectional Route Asymmetry & 4-Layer Evidence Ladder (x=372..868, w=496) -->
  <!-- Center Upper Card: Route Asymmetry -->
  <g filter="url(#cardShadow)">
    <rect x="372" y="176" width="496" height="206" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
    <path d="M 372 186 Q 372 176 382 176 L 858 176 Q 868 176 868 186 L 868 222 L 372 222 Z" fill="url(#centerGrad)"/>
    <text x="388" y="204" font-size="13.5" font-weight="700" fill="#FFFFFF">双向非对称链路与回执关联机制 (references/handoffs.md)</text>

    <!-- Forward Route Card -->
    <rect x="386" y="232" width="468" height="68" rx="6" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.2"/>
    <text x="398" y="250" font-size="12" font-weight="700" fill="#1D4ED8">正向链路｜Codex Desktop → Antigravity Desktop (单工具闭环取回)</text>
    <text x="398" y="268" font-size="9.6" fill="#1E3A8A">① 发送：send_to_antigravity_conversation(surface=&quot;desktop&quot;, conversationId, cwd, requestId)</text>
    <text x="398" y="285" font-size="9.6" fill="#1E3A8A">② 取回：read_antigravity_delivery(surface=&quot;desktop&quot;, requestId) 直接观测 reply_received 与回复</text>

    <!-- Reverse Route Card -->
    <rect x="386" y="308" width="468" height="64" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.4"/>
    <text x="398" y="326" font-size="12" font-weight="700" fill="#B45309">反向链路｜Antigravity Desktop → Codex Desktop (回执与内容分步取回 ★)</text>
    <text x="398" y="343" font-size="9.6" fill="#78350F">① 发送：核验 sender.status=&quot;verified&quot; → send_to_agent_task(target=&quot;codex&quot;, conversationId, ...)</text>
    <text x="398" y="360" font-size="9.6" fill="#78350F">② 取回：read_agent_delivery 查传输态 + read_agent_task 读正文并核对 Reply-To: &lt;UUID&gt;</text>
  </g>

  <!-- Center Lower Card: 4-Layer Evidence Ladder -->
  <g filter="url(#cardShadow)">
    <rect x="372" y="394" width="496" height="190" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="372" y="394" width="496" height="30" rx="10" fill="#F1F5F9"/>
    <rect x="372" y="412" width="496" height="12" fill="#F1F5F9"/>
    <line x1="372" y1="424" x2="868" y2="424" stroke="#CBD5E1" stroke-width="1"/>
    <text x="620" y="414" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">四层证据阶梯：严禁将“服务就绪”或“投递受理”冒充“任务完成”</text>

    <!-- Step 1 -->
    <rect x="386" y="432" width="468" height="32" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="386" y="432" width="136" height="32" rx="5" fill="#E2E8F0"/>
    <text x="454" y="452" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">L1 · 前置就绪</text>
    <text x="532" y="452" font-size="10.8" fill="#475569">status 就绪 / 会话已列出 → 仅证明前置条件，未发生任何投递</text>

    <!-- Step 2 -->
    <rect x="386" y="470" width="468" height="32" rx="5" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <rect x="386" y="470" width="136" height="32" rx="5" fill="#FDE68A"/>
    <text x="454" y="490" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">L2 · 传输受理</text>
    <text x="532" y="490" font-size="10.8" fill="#78350F">pending / accepted / delivered → 严禁换 ID 重发；沿原单续查</text>

    <!-- Step 3 -->
    <rect x="386" y="508" width="468" height="32" rx="5" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <rect x="386" y="508" width="136" height="32" rx="5" fill="#BFDBFE"/>
    <text x="454" y="528" font-size="11" font-weight="700" fill="#1E3A8A" text-anchor="middle">L3 · 关联回复</text>
    <text x="532" y="528" font-size="10.8" fill="#1E40AF">命中当前 Request UUID / Marker → 往返成立，防误读历史旧轮次</text>

    <!-- Step 4 -->
    <rect x="386" y="546" width="468" height="30" rx="5" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <rect x="386" y="546" width="136" height="30" rx="5" fill="#BBF7D0"/>
    <text x="454" y="565" font-size="11" font-weight="700" fill="#14532D" text-anchor="middle">L4 · 任务结论</text>
    <text x="532" y="565" font-size="10.8" fill="#166534">区分 needs input / reported complete / failed；不谎称独立验证</text>
  </g>

  <!-- RIGHT COLUMN: Google Antigravity Desktop (x=904..1208, w=304) -->
  <g filter="url(#cardShadow)">
    <rect x="904" y="176" width="304" height="408" rx="10" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1.5"/>
    <path d="M 904 186 Q 904 176 914 176 L 1198 176 Q 1208 176 1208 186 L 1208 232 L 904 232 Z" fill="url(#agyGrad)"/>
    <text x="920" y="201" font-size="14.5" font-weight="700" fill="#FFFFFF">Google Antigravity (反重力)</text>
    <text x="920" y="220" font-size="11" font-weight="600" fill="#F3E8FF">宿主端 B · 桌面原生会话 (target=&quot;codex&quot;)</text>

    <!-- Antigravity Box 1 -->
    <rect x="918" y="246" width="276" height="104" rx="7" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.2"/>
    <text x="930" y="266" font-size="12.5" font-weight="700" fill="#4C1D95">1. 出站桥接 · agent-bridge</text>
    <text x="930" y="285" font-size="10.5" fill="#5B21B6" font-family="Consolas, monospace">· agent_bridge_status()</text>
    <text x="930" y="302" font-size="10.5" fill="#5B21B6" font-family="Consolas, monospace">· list_agent_tasks(target=&quot;codex&quot;)</text>
    <text x="930" y="319" font-size="10.5" fill="#5B21B6" font-family="Consolas, monospace">· send_to_agent_task(target=&quot;codex&quot;)</text>
    <text x="930" y="336" font-size="10.5" fill="#5B21B6" font-family="Consolas, monospace">· read_agent_delivery() + read_agent_task()</text>

    <!-- Antigravity Box 2 -->
    <rect x="918" y="362" width="276" height="94" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="930" y="382" font-size="12.5" font-weight="700" fill="#0F172A">2. 原生身份与工作区强校验</text>
    <text x="930" y="401" font-size="10.8" fill="#475569">· 发送前必核 sender.status == &quot;verified&quot;</text>
    <text x="930" y="419" font-size="10.8" fill="#475569">· 匹配同项目路径 (gitFolder.folderUri / folderUri)</text>
    <text x="930" y="437" font-size="10.8" fill="#B45309" font-weight="600">· 仅使用 target=&quot;codex&quot;，严禁路由至 Claude</text>

    <!-- Antigravity Box 3 -->
    <rect x="918" y="468" width="276" height="68" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="930" y="488" font-size="12.5" font-weight="700" fill="#0F172A">3. 跨端交接语言与权限边界</text>
    <text x="930" y="506" font-size="10.8" fill="#475569">· 出站 Prompt 统一用英文撰写并署名 Antigravity</text>
    <text x="930" y="523" font-size="10.8" fill="#475569">· 保留技术标识符与排除项，不泄漏无关会话</text>

    <!-- Antigravity Footer -->
    <rect x="918" y="546" width="276" height="26" rx="5" fill="#F3E8FF"/>
    <text x="1056" y="563" font-size="9.6" font-weight="600" fill="#4C1D95" text-anchor="middle" font-family="Consolas, monospace">~/.gemini/config/skills/codex-antigravity-dialogue</text>
  </g>

  <!-- ==================== LAYER 3: GLOBAL SAFETY GATES & DOCTOR.PY ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="32" y="600" width="1176" height="106" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="32" y="600" width="1176" height="26" rx="10" fill="#F1F5F9"/>
    <rect x="32" y="614" width="1176" height="12" fill="#F1F5F9"/>
    <line x1="32" y1="626" x2="1208" y2="626" stroke="#CBD5E1" stroke-width="1"/>
    <text x="620" y="618" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">三大全局安全护栏与零联网离线诊断工具 (Global Safety Invariants &amp; scripts/doctor.py)</text>

    <!-- Gate 1 -->
    <circle cx="56" cy="656" r="10" fill="#DBEAFE"/>
    <text x="56" y="660" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">1</text>
    <text x="74" y="651" font-size="12" font-weight="700" fill="#0F172A">严禁越权与跨路由代偿</text>
    <text x="74" y="670" font-size="10.5" fill="#475569">绝不用 CLI Worker (send_to_worker) 替代桌面会话；</text>
    <text x="74" y="687" font-size="10.5" fill="#475569">绝不伪造身份、不新建空白会话、不打断运行中的实验</text>

    <line x1="416" y1="634" x2="416" y2="696" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Gate 2 -->
    <circle cx="440" cy="656" r="10" fill="#FEF3C7"/>
    <text x="440" y="660" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">2</text>
    <text x="458" y="651" font-size="12" font-weight="700" fill="#0F172A">超时原单续查与防重发机制</text>
    <text x="458" y="670" font-size="10.5" fill="#475569">超时仅代表状态未决；输出 Handoff Ledger 锁定原 UUID，</text>
    <text x="458" y="687" font-size="10.5" fill="#475569">下一轮优先读取原回执与目标线程，严禁伪装成追问重发</text>

    <line x1="824" y1="634" x2="824" y2="696" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Gate 3 -->
    <circle cx="848" cy="656" r="10" fill="#F3E8FF"/>
    <text x="848" y="660" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">3</text>
    <text x="866" y="651" font-size="12" font-weight="700" fill="#0F172A">零联网脱敏诊断 (scripts/doctor.py)</text>
    <text x="866" y="670" font-size="10.5" fill="#475569">Python 3.11+ 纯标准库只读核查 TOML/JSON 配置与回执；</text>
    <text x="866" y="687" font-size="10.5" fill="#475569">自动剥离私有路径与密钥，显式标注 live_probe=false</text>
  </g>
</svg>
